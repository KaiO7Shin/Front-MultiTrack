services:
  - type: web
    name: multitrack-admin
    runtime: static
    buildCommand: npm ci && npm run build:admin
    staticPublishPath: ./apps/admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        sync: false

  - type: web
    name: multitrack-public
    runtime: static
    buildCommand: npm ci && npm run build:public
    staticPublishPath: ./apps/public/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        sync: false

  - type: web
    name: multitrack-organizer
    runtime: static
    buildCommand: npm ci && npm run build:organizer
    staticPublishPath: ./apps/organizer/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        sync: false
