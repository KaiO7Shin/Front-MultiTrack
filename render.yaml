# Site public MultiTrack (SPA React Router).
# Sans la rewrite /* → /index.html, un F5 sur /courses (etc.) renvoie "Not Found".
#
# Si le service existe déjà hors Blueprint : Dashboard → Redirects/Rewrites →
#   Source: /*   Destination: /index.html   Action: Rewrite
services:
  - type: web
    name: front-defi-vtt
    runtime: static
    buildCommand: npm ci && npm run build:public
    staticPublishPath: ./apps/public/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Définir VITE_API_URL dans le dashboard (lue au build), sans slash final.
      - key: VITE_API_URL
        sync: false
